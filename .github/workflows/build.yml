name: Build

on:
  push:
    # Only release tags build — main pushes never spend Actions minutes.
    tags: ["v*"]
  workflow_dispatch:

# One build at a time; a newer tag cancels the stale run instead of burning
# minutes in parallel.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend (gtk/webkit) needs system libraries to
      # compile; macOS and Windows runners have their equivalents built in.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:run

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  build:
    needs: quality
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (app + dmg; thin LTO keeps the 7GB runner
          # from OOM-killing the link step)
          - os: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          # Windows 11 — x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Windows 11 — ARM64 (native hosted runner)
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        # npm swallows --flags after `run` unless separated by `--`.
        # dmg bundling is done manually below: tauri's bundle_dmg.sh output
        # is swallowed by the bundler on failure, and the script depends on
        # runner-volatile tools (hdiutil mount quirks, SetFile). A plain
        # hdiutil image with an Applications symlink is deterministic and
        # equivalent to what tauri produces on CI (Finder cosmetics are
        # skipped there anyway via --skip-jenkins).
        run: CARGO_PROFILE_RELEASE_LTO=thin npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Create dmg (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -e
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/BrushLLM Studio.app"
          DMG="$BUNDLE/dmg/BrushLLM Studio_0.0.1_aarch64.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p "$BUNDLE/dmg"
          hdiutil create -volname "BrushLLM Studio" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Build app (Windows)
        if: matrix.target != 'aarch64-apple-darwin'
        run: npm run tauri build ${{ matrix.args }}

      # The WiX msi filename carries the installer locale (e.g. _en-US),
      # which reads like an English-only build for a multilingual app —
      # strip it; the NSIS setup.exe carries the language selector.
      - name: Normalize msi names (drop locale suffix)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          find src-tauri/target -path "*bundle/msi/*_en-US.msi" | while read -r f; do
            mv "$f" "${f%_en-US.msi}.msi"
          done
          find src-tauri/target -path "*bundle/msi/*.msi" -exec ls -lh {} \;

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  ios:
    needs: quality
    name: ios-aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-aarch64

      - name: Install frontend dependencies
        run: npm ci

      # Generates the Xcode project (installs xcodegen via brew if the
      # image lacks it) and runs pod install.
      - name: Init iOS project
        run: npx tauri ios init --ci

      # Unsigned DEVICE build (not a simulator build, no Developer signing):
      # the `--` args reach xcodebuild for build+archive and disable code
      # signing. tauri's final export step insists on a signing identity and
      # fails — expected; the .app already sits in the .xcarchive, so the
      # next step salvages it into an unsigned IPA (sideloadable via
      # Sideloadly/AltStore with the user's own free Apple ID).
      - name: Build iOS (unsigned)
        run: >
          npx tauri ios build --target aarch64 --ci --
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          || echo "::warning::export step failed without signing (expected) — salvaging the .app"

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find src-tauri/gen/apple -path "*.xcarchive/Products/Applications/*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app found in the archive"
            exit 1
          fi
          echo "salvaged: $APP"
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/Payload"
          cp -R "$APP" "$STAGING/Payload/"
          (cd "$STAGING" && zip -qry "$GITHUB_WORKSPACE/BrushLLM-Studio_0.0.1_ios-arm64-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/BrushLLM-Studio_0.0.1_ios-arm64-unsigned.ipa"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Studio-ios-aarch64
          if-no-files-found: error
          path: BrushLLM-Studio_0.0.1_ios-arm64-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # CI ships the three desktop installers plus the unsigned iOS IPA.
    # Android is built locally with the Zcode plugin toolchain and attached
    # separately.
    needs: [build, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.ipa
