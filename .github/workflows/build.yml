name: Build

on:
  push:
    # Only release tags build — main pushes never spend Actions minutes.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Job to validate, or release to build and publish all installers
        type: choice
        default: quality
        options:
          - quality
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - release
      release_sha:
        description: Full SHA from main to build when target is release
        type: string
      reuse_run_id:
        description: Optional previous Build run with all three installers ready
        type: string

permissions:
  contents: read

env:
  BUILD_SHA: ${{ inputs.target == 'release' && inputs.release_sha || github.sha }}

# One build at a time; a newer tag cancels the stale run instead of burning
# minutes in parallel. The group is tag-independent: per-ref groups would let
# two different tags run concurrently (the expensive macOS job bills at 10x).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'release' && format('validate-{0}', inputs.target) || 'release-build' }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    if: github.event_name == 'push' || inputs.target == 'quality' || inputs.target == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.number }}
    steps:
      - name: Validate manual release request
        if: inputs.target == 'release'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch releases from main with a full release SHA"
            exit 1
          fi
          if [[ -n "$REUSE_RUN_ID" && ! "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Enter a numeric Build run ID"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: ${{ inputs.target == 'release' && '0' || '1' }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Check versions before installing any build dependencies.
      - name: Version consistency
        id: version
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$VERSION" != "$CARGO_VERSION" || "$VERSION" != "$TAURI_VERSION" ]]; then
            echo "::error::Versions differ (package.json=$VERSION, Cargo.toml=$CARGO_VERSION, tauri.conf.json=$TAURI_VERSION)"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::The tag must match the application version v$VERSION"
            exit 1
          fi
          if [[ "$RELEASE_TARGET" == release ]]; then
            git merge-base --is-ancestor "$BUILD_SHA" "$GITHUB_SHA"
            git diff --exit-code "$BUILD_SHA" "$GITHUB_SHA" -- . ':(exclude).github/workflows/**'
            status=0
            git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" || status=$?
            if [[ "$status" != 2 ]]; then
              echo "::error::Could not confirm tag v$VERSION is available"
              exit 1
            fi
          fi
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the previous installer build
        if: inputs.target == 'release' && inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          RUN_API="repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID"
          RUN_SHA=$(gh api "$RUN_API" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.path == ".github/workflows/build.yml" and .status == "completed"
              and .head_branch == "main" and .head_repository.full_name == $repo)
            | .head_sha')
          git diff --exit-code "$BUILD_SHA" "$RUN_SHA" -- . ':(exclude).github/workflows/**'
          gh api "$RUN_API/jobs" | jq -e '
            [.jobs[] | select(.conclusion == "success") | .name] as $passed
            | (["quality gates","aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc"] - $passed | length) == 0'

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend (gtk/webkit) needs system libraries to
      # compile; macOS and Windows runners have their equivalents built in.
      - name: Install Linux system deps
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: npm ci

      - name: Typecheck
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: npm run typecheck

      - name: Generate desktop icons
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: npm run icons

      - name: Frontend tests
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: npm run test:run

      - name: Rust format
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust tests
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: cargo test --lib
        working-directory: src-tauri

      - name: Clippy
        if: inputs.target != 'release' || inputs.reuse_run_id == ''
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  build:
    needs: quality
    if: ${{ !cancelled() && ((needs.quality.result == 'success' && (github.event_name == 'push' || (inputs.target == 'release' && inputs.reuse_run_id == ''))) || (needs.quality.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.target != 'quality' && inputs.target != 'release')) }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'release' && format('["{0}"]', inputs.target) || '["aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc"]') }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' || matrix.target == 'x86_64-pc-windows-msvc' && 'windows-latest' || 'windows-11-arm' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        # npm swallows --flags after `run` unless separated by `--`.
        # dmg bundling is done manually below: tauri's bundle_dmg.sh output
        # is swallowed by the bundler on failure, and the script depends on
        # runner-volatile tools (hdiutil mount quirks, SetFile). A plain
        # hdiutil image with an Applications symlink is deterministic and
        # equivalent to what tauri produces on CI (Finder cosmetics are
        # skipped there anyway via --skip-jenkins).
        run: CARGO_PROFILE_RELEASE_LTO=thin npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Create dmg (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/BrushLLM Image Studio.app"
          DMG="installers/BrushLLM.Image.Studio-$VERSION-arm64.dmg"
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p installers
          hdiutil create -volname "BrushLLM Image Studio" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Build app (Windows)
        if: matrix.target != 'aarch64-apple-darwin'
        # NSIS only — the msi flavor is dropped from the release line.
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      - name: Stage Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          installers=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ] || [ ! -s "${installers[0]}" ]; then
            echo "::error::Expected one NSIS installer for ${{ matrix.target }}"
            exit 1
          fi
          mkdir -p installers
          ARCH="${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'arm64' }}"
          cp "${installers[0]}" "installers/BrushLLM.Image.Studio-$VERSION-$ARCH.exe"

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: BrushLLM-Studio-${{ matrix.target }}
          if-no-files-found: error
          path: installers/BrushLLM.Image.Studio-*

  release:
    if: ${{ !cancelled() && needs.quality.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'release') && (needs.build.result == 'success' || (inputs.target == 'release' && inputs.reuse_run_id != '' && needs.build.result == 'skipped')) }}
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/download-artifact@v7
        with:
          pattern: BrushLLM-Studio-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ inputs.target == 'release' && inputs.reuse_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.target == 'release' && inputs.reuse_run_id || github.run_id }}

      - name: Verify release assets and select notes
        id: release_files
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          for platform in arm64.dmg x64.exe arm64.exe; do
            test -s "artifacts/BrushLLM.Image.Studio-$VERSION-$platform"
          done
          NOTES="docs/releases/v$VERSION.md"
          if [ -s "$NOTES" ]; then
            echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release workflow SHA
        if: inputs.target == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          # The quality gate has compared the workflow commit with the installer source.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field "ref=refs/tags/v$VERSION" --raw-field "sha=$GITHUB_SHA" --silent

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.quality.outputs.version }}
          name: "BrushLLM Image Studio v${{ needs.quality.outputs.version }}"
          body_path: ${{ steps.release_files.outputs.notes }}
          generate_release_notes: ${{ steps.release_files.outputs.notes == '' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/BrushLLM.Image.Studio-*.dmg
            artifacts/BrushLLM.Image.Studio-*.exe
