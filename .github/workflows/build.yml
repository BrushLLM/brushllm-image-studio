name: Build

on:
  push:
    # Only release tags build — main pushes never spend Actions minutes.
    tags: ["v*"]
  workflow_dispatch:

# One build at a time; a newer tag cancels the stale run instead of burning
# minutes in parallel.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend (gtk/webkit) needs system libraries to
      # compile; macOS and Windows runners have their equivalents built in.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:run

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  build:
    needs: quality
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (app + dmg; thin LTO keeps the 7GB runner
          # from OOM-killing the link step)
          - os: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          # Windows 11 — x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Windows 11 — ARM64 (native hosted runner)
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        # npm swallows --flags after `run` unless separated by `--`.
        run: CARGO_PROFILE_RELEASE_LTO=thin npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Build app (Windows)
        if: matrix.target != 'aarch64-apple-darwin'
        run: npm run tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # CI ships the three desktop installers only. Mobile builds (Android
    # APK, iOS) are produced locally with the Zcode emulator plugins and
    # attached to this release separately.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
