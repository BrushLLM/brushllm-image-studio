name: Build

on:
  push:
    # Only release tags build — main pushes never spend Actions minutes.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Job to validate
        type: choice
        default: quality
        options:
          - quality
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

# One build at a time; a newer tag cancels the stale run instead of burning
# minutes in parallel. The group is tag-independent: per-ref groups would let
# two different tags run concurrently (the expensive macOS job bills at 10x).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('validate-{0}', inputs.target) || 'release-build' }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    if: github.event_name == 'push' || inputs.target == 'quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend (gtk/webkit) needs system libraries to
      # compile; macOS and Windows runners have their equivalents built in.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # A tag build with mismatched in-app versions ships installers whose
      # names claim one version while the app reports another — the update
      # check would then flag the fresh release as outdated. Fail before any
      # expensive matrix job runs.
      - name: Version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
            CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
            TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            for v in "$PKG_VERSION" "$CARGO_VERSION" "$TAURI_VERSION"; do
              if [ "$v" != "$TAG_VERSION" ]; then
                echo "::error::tag v$TAG_VERSION does not match in-app version $v (package.json=$PKG_VERSION, Cargo.toml=$CARGO_VERSION, tauri.conf.json=$TAURI_VERSION)"
                exit 1
              fi
            done
            echo "versions consistent: $TAG_VERSION"
          else
            echo "not a tag build — skipping version check"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Generate desktop icons
        run: npm run icons

      - name: Frontend tests
        run: npm run test:run

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

  build:
    needs: quality
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.quality.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.target != 'quality')) }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc"]') }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' || matrix.target == 'x86_64-pc-windows-msvc' && 'windows-latest' || 'windows-11-arm' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        # npm swallows --flags after `run` unless separated by `--`.
        # dmg bundling is done manually below: tauri's bundle_dmg.sh output
        # is swallowed by the bundler on failure, and the script depends on
        # runner-volatile tools (hdiutil mount quirks, SetFile). A plain
        # hdiutil image with an Applications symlink is deterministic and
        # equivalent to what tauri produces on CI (Finder cosmetics are
        # skipped there anyway via --skip-jenkins).
        run: CARGO_PROFILE_RELEASE_LTO=thin npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Create dmg (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/BrushLLM Image Studio.app"
          DMG="installers/BrushLLM.Image.Studio-$VERSION-arm64.dmg"
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p installers
          hdiutil create -volname "BrushLLM Image Studio" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Build app (Windows)
        if: matrix.target != 'aarch64-apple-darwin'
        # NSIS only — the msi flavor is dropped from the release line.
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      - name: Stage Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          installers=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ] || [ ! -s "${installers[0]}" ]; then
            echo "::error::Expected one NSIS installer for ${{ matrix.target }}"
            exit 1
          fi
          mkdir -p installers
          ARCH="${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || 'arm64' }}"
          cp "${installers[0]}" "installers/BrushLLM.Image.Studio-$VERSION-$ARCH.exe"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Studio-${{ matrix.target }}
          if-no-files-found: error
          path: installers/BrushLLM.Image.Studio-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # CI ships the three desktop installers only — mobile (iOS/Android)
    # builds are retired.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release assets and select notes
        id: release_files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for platform in arm64.dmg x64.exe arm64.exe; do
            test -s "artifacts/BrushLLM.Image.Studio-$VERSION-$platform"
          done
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -s "$NOTES" ]; then
            echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: "BrushLLM Image Studio ${{ github.ref_name }}"
          body_path: ${{ steps.release_files.outputs.notes }}
          generate_release_notes: ${{ steps.release_files.outputs.notes == '' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/BrushLLM.Image.Studio-*.dmg
            artifacts/BrushLLM.Image.Studio-*.exe
