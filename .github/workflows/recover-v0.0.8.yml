name: Complete v0.0.8 release

# macOS 14 was retired before this release. Reuse the original Windows
# installers and quality results; build only the macOS installer once.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-v0.0.8-release
  cancel-in-progress: false

jobs:
  complete-release:
    if: >-
      github.event.workflow_run.id == 42153047934 &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'v0.0.8' &&
      github.event.workflow_run.head_sha == 'a1470b303b921d53824665c8184310a046758fe1' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.0.8
      RELEASE_SHA: a1470b303b921d53824665c8184310a046758fe1
      SOURCE_RUN: '42153047934'
    steps:
      - name: Verify original quality and Windows jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-jobs.json').read_text())['jobs']
          for name in ('quality gates', 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'):
              matches = [j for j in jobs if j['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', f'{name} did not succeed'
          PY

      - uses: actions/checkout@v4
        with:
          ref: v0.0.8

      - name: Verify immutable release source and versions
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          for name in ('package.json', 'src-tauri/tauri.conf.json'):
              assert json.loads(Path(name).read_text())['version'] == version, name
          cargo = re.search(r'^version = "([^"]+)"', Path('src-tauri/Cargo.toml').read_text(), re.M).group(1)
          assert cargo == version
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS app
        run: CARGO_PROFILE_RELEASE_LTO=thin npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Create macOS installer
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          STAGING=$(mktemp -d)
          cp -R "$BUNDLE/macos/BrushLLM Image Studio.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p artifacts
          hdiutil create -volname "BrushLLM Image Studio" -srcfolder "$STAGING" -ov -format UDZO "artifacts/BrushLLM.Image.Studio-$VERSION-arm64.dmg"

      - name: Reuse original Windows installers
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '42153047934'
          pattern: BrushLLM-Studio-*-windows-msvc
          merge-multiple: true
          path: artifacts/windows

      - name: Verify installers and extract the tagged release notes
        run: |
          python3 - <<'PY'
          import os, textwrap
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          files = [p for p in Path('artifacts').rglob('*') if p.is_file() and p.suffix in ('.dmg', '.exe')]
          expected = {f'BrushLLM.Image.Studio-{version}-{arch}.{ext}' for arch, ext in [('arm64', 'dmg'), ('x64', 'exe'), ('arm64', 'exe')]}
          assert len(files) == 3 and {p.name for p in files} == expected, files
          assert all(p.stat().st_size > 0 for p in files)
          workflow = Path('.github/workflows/build.yml').read_text()
          notes = workflow.split('cat > /tmp/release-notes.md << EOF\n', 1)[1].split('\n          EOF', 1)[0]
          notes = textwrap.dedent(notes).replace('${VERSION}', version).replace('\\`', '`')
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes + '\n')
          PY

      - name: Publish the three verified installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.8
          name: BrushLLM Image Studio v0.0.8
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/windows/**/*.exe
