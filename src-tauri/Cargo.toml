[package]
name = "image-studio"
version = "0.0.9"
description = "BrushLLM Image Studio — local-first AI image toolbox"
authors = ["BrushLLM"]
edition = "2021"

[lib]
name = "image_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local image codecs. The WebView displays a placeholder for unsupported thumbnails.
tiff = { version = "0.11", features = ["deflate"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
    "ico",
] }
# SVG input rasterization (pure Rust, MPL-2.0).
resvg = "0.48"
fast_image_resize = "5"
ravif = { version = "0.12", default-features = false }
rgb = "0.8"
imgref = "1.9"
# Real lossy WebP (libwebp). The image crate's pure-Rust WebPEncoder is
# lossless-only, so "compress to webp" was actually repacking losslessly and
# often came out LARGER than the input. libwebp-sys bundles the C library.
libwebp-sys = "0.9"
kamadak-exif = "0.5"
crc32fast = "1"

# Cloud API client with rustls.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
# Host classification for the gateway URL policy (loopback/private checks).
# Same version reqwest already depends on, so this adds no new code.
url = "2.5"
base64 = "0.22"

# Secrets + errors
thiserror = "2"

# Desktop credential storage.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already used transitively by keyring; query item existence without reading
# secret bytes or prompting for access just to render Settings.
security-framework = "3"

[profile.release]
codegen-units = 1
# Thin LTO: near-identical codegen quality to fat LTO, but far lower peak
# memory — the 7 GB GitHub macOS runner gets OOM-killed with fat LTO.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
